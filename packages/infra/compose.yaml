# The grc stack (D5, D13, D21, D60, D61, D63, D82, D98, D106).
# Run from the repo root with the secrets file:
#   docker compose -f packages/infra/compose.yaml --env-file .env up -d
# Neo4j Desktop and Ollama run natively on the Mac and are reached through
# host.docker.internal (D5). Only Caddy publishes ports, on 127.0.0.1 (D61).
# The dev switch (compose.dev.yaml) is off unless named with a second -f.
name: grc

services:
  grc-postgres:
    image: pgvector/pgvector:pg18
    container_name: grc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Read once by postgres/init/01-roles.sql to create grc_app and grc_migrator (D57).
      DATABASE_URL_APP: ${DATABASE_URL_APP}
      DATABASE_URL_MIGRATE: ${DATABASE_URL_MIGRATE}
    volumes:
      - grc-postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      # D142: marks pgvector 0.8.6 as trusted, so grc_migrator (NOSUPERUSER) can install it.
      - ./postgres/extension/vector--0.8.6.control:/usr/share/postgresql/18/extension/vector--0.8.6.control:ro
    networks:
      - grc-internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G

  grc-seaweedfs:
    image: chrislusf/seaweedfs:4.47
    container_name: grc-seaweedfs
    restart: unless-stopped
    # The one backend-only service key (D57): s3.json is filled from .env at start, so the key
    # never sits in a committed file. With identities set, anonymous access is off (D53).
    entrypoint:
      - /bin/sh
      - -c
      - >-
        sed -e "s|<S3_ACCESS_KEY>|$$S3_ACCESS_KEY|" -e "s|<S3_SECRET_KEY>|$$S3_SECRET_KEY|"
        /etc/seaweedfs/s3.template.json > /tmp/s3.json
        && exec weed server -dir=/data -s3 -s3.port=8333 -s3.ip.bind=0.0.0.0 -s3.config=/tmp/s3.json -volume.max=0 -master.volumeSizeLimitMB=256
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      WEED_MASTER_VOLUME_GROWTH_COPY_1: '1'
    volumes:
      - grc-seaweedfs-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.template.json:ro
    networks:
      - grc-internal
    deploy:
      resources:
        limits:
          memory: 512M

  # The front door (D60): the built web app and the Caddyfile are baked into the image.
  grc-caddy:
    build:
      context: ../..
      dockerfile: packages/web/Dockerfile
    image: grc-caddy:local
    container_name: grc-caddy
    restart: unless-stopped
    ports:
      - '127.0.0.1:443:443'
      - '127.0.0.1:80:80'
    volumes:
      - grc-caddy-data:/data
      - grc-caddy-config:/config
    networks:
      - grc-edge
    deploy:
      resources:
        limits:
          memory: 128M

  # One image, two programs (D36): the API and the worker differ only in their start command.
  grc-api:
    build:
      context: ../..
      dockerfile: packages/api/Dockerfile
    image: grc-app:local
    container_name: grc-api
    restart: unless-stopped
    command: ['pnpm', '--filter', '@grc/api', 'start:api']
    environment: &app-env
      NODE_ENV: production
      # Listen on every interface inside the container, so Caddy reaches the API over grc-edge.
      # No ports are published (D61, D63, D165).
      HOST: 0.0.0.0
      # Better Auth's signing secret (D49, D165), from .env only.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # The restricted app account only (D57, D73); the migration URL never reaches the runtime.
      DATABASE_URL_APP: ${DATABASE_URL_APP}
      NEO4J_URI: bolt://host.docker.internal:7687
      NEO4J_ADMIN_PASSWORD: ${NEO4J_ADMIN_PASSWORD}
      NEO4J_WRITER_PASSWORD: ${NEO4J_WRITER_PASSWORD}
      NEO4J_QUERY_SECRET: ${NEO4J_QUERY_SECRET}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      S3_ENDPOINT: http://grc-seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - grc-internal
      - grc-edge
    depends_on:
      grc-postgres:
        condition: service_healthy
      grc-seaweedfs:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1G

  grc-worker:
    build:
      context: ../..
      dockerfile: packages/api/Dockerfile
    image: grc-app:local
    container_name: grc-worker
    restart: unless-stopped
    command: ['pnpm', '--filter', '@grc/api', 'start:worker']
    environment: *app-env
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - grc-internal
      - grc-edge
    depends_on:
      grc-postgres:
        condition: service_healthy
      grc-seaweedfs:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1G

networks:
  # No internet (D63): Postgres and SeaweedFS live only here.
  grc-internal:
    name: grc-internal
    internal: true
  # The API and worker reach the Mac and the internet (SSO only); Caddy reaches the API.
  grc-edge:
    name: grc-edge

volumes:
  grc-postgres-data:
    name: grc-postgres-data
  grc-seaweedfs-data:
    name: grc-seaweedfs-data
  grc-caddy-data:
    name: grc-caddy-data
  grc-caddy-config:
    name: grc-caddy-config
